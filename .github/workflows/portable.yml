name: Portable core and viewer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-compile numpy Pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python restore_assets.py
      - run: python instrument-rebuild/build.py
      - run: python instrument-rebuild/studio/audit_geometry.py
      - run: cmake -S . -B output/native-build
      - run: cmake --build output/native-build --config Release --parallel 2
      - run: ctest --test-dir output/native-build -C Release --output-on-failure
      - run: python tools/browser_smoke.py
        env:
          CYBR_SOFTWARE_GL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-${{ matrix.os }}
          path: output/portable-smoke
